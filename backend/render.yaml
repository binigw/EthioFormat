services:
  - type: web
    name: ethioformat-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 1 --threads 4 -k uvicorn.workers.UvicornWorker --max-requests 100 --max-requests-jitter 20 --timeout 120 --graceful-timeout 30 app.main:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHONIOENCODING
        value: "utf-8"
      - key: PYTHONUTF8
        value: "1"
      - key: LANG
        value: "C.UTF-8"
      - key: LC_ALL
        value: "C.UTF-8"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CBE_ACCOUNT_NUMBER
        value: "1000659424936"
      - key: CBE_ACCOUNT_NAME
        value: "BINIAM KEBEDE AMADE"
      - key: GMAIL_IMAP_SERVER
        value: "imap.gmail.com"
      - key: GMAIL_IMAP_PORT
        value: "993"
      - key: GMAIL_IMAP_USER
        sync: false
      - key: GMAIL_IMAP_PASSWORD
        sync: false
      - key: IMAP_POLL_INTERVAL_SECONDS
        value: "20"
      - key: SUPABASE_BUCKET_NAME
        value: "ethioformat-documents"
      - key: FRONTEND_URL
        value: "https://ethioformat.netlify.app"
